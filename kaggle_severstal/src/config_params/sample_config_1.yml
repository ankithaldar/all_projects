# ===========================================================================
# 0. GLOBAL SETTINGS
#    Everything that is *not* data, model, training, etc. but still global.
# ===========================================================================
global_:
  run_id: null                       # str | null -> auto-generated timestamp
  seed: &seed 42                           # int | null -> disable
  deterministic: false               # bool -> cudnn.deterministic & benchmark
  hardware:
    accelerator: auto                # cpu | gpu | tpu | hpu | auto
    devices: auto                      # int | list[int] | "auto"
    strategy: ddp                    # ddp | ddp_spawn | deepspeed | fsdp | ...
    precision: 16-mixed              # 32 | 16-mixed | bf16-mixed | 64
    amp_backend: native              # native | apex
    enable_progress_bar: True
  tags: &defaults ["baseline", "debug"]        # list[str] -> passed to every logger

# ===========================================================================
# 1. DATA
# ===========================================================================
data:
  source:
    type: 'local'                    # "local", "s3", "gcs", "hf", "synthetic"
    path: null                       # str | null -> mutually exclusive
    streaming: false                 # bool -> HF streaming
    synthetic_size: null             # if type=synthetic, specify (num_samples, feature_dim)
    hf_dataset: null                 # HuggingFace dataset name if type=hf
    hf_config: null                  # For multilingual datasets
    hf_split: null                   # Specific split for HF datasets
  splits:
    train: 0.8                       # float | int | list[int] indices
    val: 0.1
    test: 0.1
    split_seed: *seed                # Seed for random splits
    stratify: null                   # str col name | null
    time_series_split: false         # For temporal data
  preprocessing:
    tokenizer: null                  # HF tokenizer name or path
    tokenizer_params: {}  # max_length, padding, truncation, etc.
    image_transforms: &imagenet_norm
      - name: Resize
        params: {size: [256, 256]}
      - name: ToTensor
      - name: Normalize
        params: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
    augmentations: &light_aug
      - name: RandomHorizontalFlip
        params: {p: 0.5}
      - name: ColorJitter
        params: {brightness: 0.2, contrast: 0.2, saturation: 0.2, hue: 0.1}
  dataloader:
    batch_size: &bs 32
    num_workers: 4
    pin_memory: true
    prefetch_factor: 2
    persistent_workers: true
    shuffle: true
    drop_last: true
    sampler: null                    # str class path + kwargs dict
    collate_fn: null                 # Custom collate function path

# ===========================================================================
# 2. MODEL
# ===========================================================================
model:
  architecture:
    class_path: torchvision.models.resnet18  # str -> LightningModule or nn.Module
    init_args: {}                     # kwargs passed to constructor
    custom_blocks: null  # For modifying specific layers
  pretrained_weights:
    url: null                         # str | null -> auto-download
    local_file: null                  # str | null -> absolute/relative path
    hf_hub_id: null                   # str | null -> "google/vit-base-patch16-224"
    freeze_encoder: false  # Freeze feature extractor
    strict_load: true  # Must match architecture exactly
  loss:
    - class_path: torch.nn.CrossEntropyLoss
      init_args: {}
  optimizer: &adamw
    class_path: torch.optim.AdamW
    init_args:
      lr: 3.0e-4
      weight_decay: 0.01
      betas: [0.9, 0.999]
      eps: 1.0e-8
      foreach: null                   # bool | null -> auto-detect
      fused: false
  scheduler: &cosine
    class_path: torch.optim.lr_scheduler.CosineAnnealingLR
    init_args:
      T_max: 10                       # will be overwritten by max_epochs
      eta_min: 1.0e-6
    monitor: val_loss                 # ignored by CosineAnnealing but required for ReduceLROnPlateau
    interval: epoch                   # step | epoch
    frequency: 1
    warmup:  # Only for certain schedulers
      method: "linear"  # "linear", "cosine", "constant"
      epochs: 5
      ratio: 0.1  # Starting LR = ratio * base_lr

# ===========================================================================
# 3. TRAINING LOOP
# ===========================================================================
training:
  max_epochs: 10
  min_epochs: 1
  max_steps: -1                      # int -> disable
  min_steps: null
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm      # norm | value
  accumulate_grad_batches: 1
  overfit_batches: 0.0               # float | int -> debug only
  val_check_interval: 1.0            # float | int
  check_val_every_n_epoch: 1
  log_every_n_steps: 50
  limit_train_batches: 1.0           # float | int
  limit_val_batches: 1.0
  limit_test_batches: 1.0
  reload_dataloaders_every_n_epochs: 0
  sync_batchnorm: false
  inference_mode: true               # bool -> Lightning inference vs torch.no_grad()
  fast_dev_run: false                # bool | int -> smoke-test

# ===========================================================================
# 4. CHECKPOINTING
# ===========================================================================
checkpointing: &ckpt
  dirpath: ./checkpoints
  filename: "{epoch}-{step}-{val_loss:.3f}"
  monitor: val_loss
  mode: min
  save_top_k: 3
  save_last: true
  save_weights_only: false
  auto_insert_metric_name: true
  every_n_epochs: null
  every_n_steps: null
  train_time_interval: null  # e.g., "00:30:00" for every 30 mins

# ===========================================================================
# 5. LOGGERS  (list allows multi-logging)
# ===========================================================================
loggers:
  - class_path: pytorch_lightning.loggers.TensorBoardLogger
    init_args:
      save_dir: ./logs/tensorboard
      name: null
      version: null
      log_graph: false
      default_hp_metric: true
  - class_path: pytorch_lightning.loggers.WandbLogger
    init_args:
      entity: null                    # fill via env var
      project: my_project
      name: null                      # auto
      tags: *defaults                 # ref global.tags
      notes: null
      group: null
      job_type: train
      save_dir: "logs/wandb"
      save_code: false
      offline: false
      log_model: false  # "all", "True", or False
  - class_path: pytorch_lightning.loggers.CSVLogger
    init_args:
      save_dir: ./logs/csv
      name: metrics
  # neptune, comet, mlflow etc. follow the same pattern

# ===========================================================================
# 6. CALLBACKS  (list)
# ===========================================================================
callbacks:
  - class_path: pytorch_lightning.callbacks.ModelCheckpoint
    init_args: *ckpt                 # reuse anchor
  - class_path: pytorch_lightning.callbacks.EarlyStopping
    init_args:
      monitor: val_loss
      patience: 5
      mode: min
      min_delta: 0.0
      check_finite: true
      check_on_train_epoch_end: false
  - class_path: pytorch_lightning.callbacks.LearningRateMonitor
    init_args:
      logging_interval: step          # step | epoch
      log_momentum: true

  - class_path: pytorch_lightning.callbacks.ModelSummary
    init_args:
      max_depth: 2
  - class_path: pytorch_lightning.callbacks.StochasticWeightAveraging
    init_args:
      swa_lrs: 1.0e-3
      swa_epoch_start: 0.8
      annealing_epochs: 10
      annealing_strategy: cos
  - class_path: callbacks.discord_callbacks.DiscordCallback
    init_args:
      # webhook_url: ${DISCORD_WEBHOOK_URL}
      experiment_name: experiment_name
      log_every_n_steps: 50
      log_val_metrics: true
      log_model_hyperparams: true
      max_retries: 3
  # QuantizationAwareTraining, BatchSizeFinder, custom callbacks, etc.

# ===========================================================================
# 7. INFERENCE
# ===========================================================================
inference:
  output_dir: ./predictions
  save_format: pt                    # pt | npy | jsonl | parquet
  post_processing: null              # str class path + kwargs
  batch_size: *bs                    # Inherit from data config
  device: cuda
  half_precision: false  # Use FP16 for inference
  postprocessing:
    - name: "softmax"  # Custom function names
      params: {dim: 1}
    - name: "threshold"
      params: {value: 0.5}
  metrics:
    - class_path: torchmetrics.Accuracy
      init_args:
        task: multiclass
        num_classes: 10

# ===========================================================================
# 8. SWEEP CONFIG  (used by lightning.pytorch.cli or Optuna)
# ===========================================================================
sweep:
  backend: optuna                    # optuna | wandb | ray | nevergrad | ax
  method: tpe                        # grid | random | bayes | hyperband
  n_trials: 20
  parameters:
    model.optimizer.init_args.lr:
      type: log_float
      low: 1.0e-5
      high: 1.0e-2
      log: true
    data.dataloader.batch_size:
      type: categorical
      choices: [16, 32, 64, 128]
    model.scheduler.init_args.warmup_steps:
      type: int
      low: 100
      high: 2000

# ===========================================================================
# 9. ENVIRONMENT  (for reproducible containers / clusters)
# ===========================================================================
environment:
  pip_packages:
    - torch>=2.1
    - pytorch-lightning>=2.1
    - torchmetrics>=1.0
    - transformers>=4.30
    - datasets>=2.14
  conda_packages: []
  system_packages: []
  docker_image: pytorch/pytorch:2.1.0-cuda11.8-cudnn8-devel
  python_version: "3.10"
  cuda_version: "11.8"
  cudnn_version: "8"
