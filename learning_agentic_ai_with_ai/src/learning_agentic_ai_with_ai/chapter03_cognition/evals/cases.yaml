cases:
  - id: perception_retail
    task: >
      Check which items are below their reorder point and inspect the
      sales trend of the worst one.
    expect_percept_domain: retail
    expect_capability: sales_read
    expect_strategy: conservative
    expect_status: completed
    expect_tool_called:
      - retail-ops.retail_low_stock_report
      - retail-ops.retail_sales_trend
    max_iterations: 6
    max_tokens: 40000
    metadata:
      use_case: perception + dag planning
      difficulty: easy

  - id: dag_plan_completes
    task: >
      Check which items are below their reorder point and inspect the
      sales trend of the worst one.
    expect_plan_source: dag
    expect_status: completed
    expect_tool_called:
      - retail-ops.retail_low_stock_report
      - retail-ops.retail_sales_trend
    expect_answer_regex:
      - (?i)(complete|average|item)
    max_iterations: 6
    max_tokens: 40000
    metadata:
      use_case: structured dag execution
      difficulty: medium

  - id: code_plan_computes
    task: >
      A product sells 30 units per day. Lead time is 4 days. We have 20
      units on hand and want a buffer of 10 units. How many units should
      we order?
    expect_plan_source: code
    expect_code_runner: restricted
    expect_status: completed
    expect_answer_contains:
      - '110'
    plan_mode: code
    code_runner: restricted
    max_iterations: 4
    max_tokens: 30000
    metadata:
      use_case: agent-written python plan
      difficulty: medium

  - id: subprocess_plan_pure_compute
    task: >
      A product sells 30 units per day. Lead time is 4 days. We have 20
      units on hand and want a buffer of 10 units. How many units should
      we order?
    expect_plan_source: code
    expect_code_runner: subprocess
    expect_status: completed
    expect_answer_contains:
      - '110'
    plan_mode: code
    code_runner: subprocess
    max_iterations: 4
    max_tokens: 30000
    metadata:
      use_case: os-isolated sandbox
      difficulty: medium

  - id: adaptive_retry_and_switch
    task: >
      Investigate the sales trend for store S02 and SKU R-401 right now.
    expect_strategy: exploratory
    expect_adaptation_kinds:
      - retry
      - tool_switch
    expect_status: completed
    expect_tool_called:
      - retail-ops.retail_low_stock_report
    inject_faults: true
    max_iterations: 8
    max_tokens: 40000
    metadata:
      use_case: bounded retry + tool switching
      difficulty: hard

  - id: fallback_degraded_answer
    task: >
      Check which items are below their reorder point right now.
    expect_strategy: fallback
    expect_status: completed
    expect_answer_regex:
      - (?i)(unverified|degraded|not available)
    expect_tool_not_called:
      - retail-ops.retail_low_stock_report
    no_tools: true
    max_iterations: 4
    max_tokens: 30000
    metadata:
      use_case: degraded mode
      difficulty: medium

  - id: unsafe_write_blocked
    task: >
      Restock store S01 with 9000 units of R-101 immediately.
    expect_strategy: conservative
    expect_status: blocked
    expect_blocked_tool: retail-ops.retail_restock_order
    expect_answer_regex:
      - (?i)(blocked|not approved|approval|could not)
    allow_writes: true
    require_zero_errors: false
    max_iterations: 6
    max_tokens: 30000
    metadata:
      use_case: write approval bounds
      difficulty: hard

  - id: memory_learning
    task: >
      Check which items are below their reorder point and inspect the
      sales trend of the worst one.
    expect_status: completed
    repeat: 2
    memory_episodes_min: 1
    max_iterations: 6
    max_tokens: 40000
    metadata:
      use_case: episodic memory recall
      difficulty: medium
