[project]
name = "learning-agentic-ai-with-ai"
version = "0.1.0"
description = "Agentic AI course built from scratch (no LangChain/LangGraph). LLM calls route through the local llm_gateway."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "requests>=2.32,<3",
  "PyYAML>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "mcp>=1.2,<2",
  "anyio>=4.4,<5",
  "tiktoken>=0.14.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.24,<2",
]

[tool.pytest.ini_options]
pythonpath = ["src/learning_agentic_ai_with_ai"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 79
exclude = [
  "src/learning_agentic_ai_with_ai/llm_gateway",
  "src/learning_agentic_ai_with_ai/chapter01_mcp/typescript",
]

[tool.ruff.lint]
# Complement the Google .pylintrc (authoritative for style):
# - E4/E7/E9: pycodestyle errors (E501 line length handled by pylint at 80)
# - F: pyflakes (unused imports/vars, undefined names)
# - I: import sorting
# UP (pyupgrade), EXE (shebang), BLE, and similar are excluded because they
# conflict with the mandated style (utf-8 header, typing generics, docstrings).
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["agentic_common", "chapter01_mcp", "llm_gateway"]

[tool.uv]
package = false
