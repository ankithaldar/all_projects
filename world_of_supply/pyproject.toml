[build-system]
requires = ['setuptools>=68.0']
build-backend = 'setuptools.build_meta'

[project]
name = 'world-of-supply'
version = '1.0.0'
description = 'Multi-agent reinforcement learning supply-chain environment (Ray RLlib 2.x + PyTorch)'
readme = 'README.md'
requires-python = '>=3.10,<3.14'
keywords = [
    'reinforcement-learning',
    'multi-agent',
    'marl',
    'supply-chain',
    'ray',
    'rllib',
    'pytorch',
    'ppo',
]
classifiers = [
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
]

dependencies = [
    'numpy>=1.26.0,<3.0.0',
    'networkx>=3.3',
    'matplotlib>=3.9.0',
    'Pillow>=10.4.0',
    'PyYAML>=6.0.2',
    'torch>=2.4.0',
    'gymnasium>=1.0.0',
    'ray[rllib]>=2.40.0,<3.0.0',
    'seaborn>=0.13.2',
]

[project.optional-dependencies]
notebook = [
    'ipython>=8.26',
    'jupyter>=1.1.0',
]
dev = [
    'pytest>=8.3.0',
    'ruff>=0.6.0',
]

[project.scripts]
world-of-supply = 'world_of_supply.cli:main'

[tool.setuptools.packages.find]
where = ['src']

[tool.setuptools.package-data]
world_of_supply = ['assets/*.ttf', 'assets/*.png']

[tool.pytest.ini_options]
testpaths = ['tests']

[tool.ruff]
line-length = 110
indent-width = 2

[tool.ruff.format]
quote-style = 'single'
indent-style = 'space'

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I', 'D']
ignore = ['D203', 'D213']

[tool.ruff.lint.per-file-ignores]
'tests/*' = ['D']
