# Environment parity: the uv venv (`uv sync`, including the dev
# dependency-group below) is canonical — it installs all deps.
# The system Anaconda env is not canonical; skips for deps it lacks
# (e.g. mlflow optional extras) are expected there.

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'forecast-ml-framework'
version = '0.1.0'
description = 'Config-driven Kedro ML framework for forecasting'
readme = 'README.md'
requires-python = '>=3.14'
license = { text = 'MIT' }
authors = [{ name = 'Forecast ML Framework Team' }]
dependencies = [
  'kedro',
  'kedro-datasets',
  'scikit-learn',
  'pandas',
  'numpy',
  'scipy',
  'pyarrow',
  'pydantic',
  'sqlalchemy',
  'omegaconf',
  'matplotlib',
  'fastapi',
  'uvicorn',
  'xgboost',
  'lightgbm',
  'catboost',
]

[project.optional-dependencies]
# Placeholder for libs that fail the Python 3.14 spike.
# They are kept here (not in core deps) so `uv sync` succeeds
# on 3.14. See README.md for the spike results table.
extras-314-failures = []
# polars/seaborn/dvc are not imported by src/ (grep verified
# 2026-11-05: no `import polars`/`seaborn`/`dvc` in src/);
# kept as opt-in extras rather than core dependencies.
optional = ['polars', 'seaborn', 'dvc']

# Lazy-only heavy deps (verified 2026-11-05: no module-level
# import of pyspark/h2o/shap/mlflow in src/; all are lazy
# inside adapters, spark_factory, serving/model_loader,
# and interpretability nodes). Core keeps only the deps
# used at import time plus lazy-optional gradient-boosting
# libraries (xgboost/lightgbm/catboost are also lazy in
# adapters but retained in core for the default models).
spark = ['pyspark']  # lazy: core/spark_factory only
tracking = ['mlflow']  # lazy: serving/model_loader only
explain = ['shap']  # lazy: interpretability nodes only
maximal = ['h2o']  # lazy: modeling adapters (h2o_automl) only

[dependency-groups]
dev = [
  'pytest',
  # Coverage gate: CI and ci/run_checks.sh run pytest with
  # --cov=src/forecast_ml_framework --cov-fail-under=85.
  'pytest-cov',
  # pyyaml is used only by tests (yaml.safe_load), not by src/.
  'pyyaml',
  # starlette TestClient (fastapi.testclient) requires httpx at test
  # runtime; keep it in dev so `uv run pytest` serving tests pass
  # without bloating production dependencies.
  'httpx',
]

[project.scripts]
forecast-ml = 'forecast_ml_framework.__main__:main'
forecast-ml-framework = 'forecast_ml_framework.__main__:main'

[tool.kedro]
package_name = 'forecast_ml_framework'
project_name = 'forecast-ml-framework'
kedro_init_version = '1.7.0'

[tool.hatch.build.targets.wheel]
packages = ['src/forecast_ml_framework']

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['src']
markers = [
  'serial: must run serially (mutates global state, not parallel-safe)',
]

[tool.ruff]
line-length = 80
indent-width = 2

[tool.kedro_telemetry]
project_id = "269ab3d93027411b89cf59398870bc34"
