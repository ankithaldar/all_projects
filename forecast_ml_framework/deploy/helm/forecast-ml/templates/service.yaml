apiVersion: v1
kind: Service
metadata:
  name: forecast-ml
  labels:
    app.kubernetes.io/name: forecast-ml
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/name: forecast-ml
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
