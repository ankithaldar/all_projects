# Default-deny ingress. Only Prometheus/OTel scrape and
# ingress traffic on port 8000 is allowed; no public source.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forecast-ml
  labels:
    app.kubernetes.io/name: forecast-ml
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: forecast-ml
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prometheus
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: otel
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
