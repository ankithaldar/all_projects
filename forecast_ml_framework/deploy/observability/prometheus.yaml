# Forecast ML Prometheus scrape config.
# Scrapes the app /metrics producer
# (serving/metrics.py via serving/app.py), which emits:
# http_request_duration_seconds (histogram),
# predict_requests_total / predict_errors_total
# (counters) and drift_psi / drift_ks (gauges,
# refreshed by the monitoring pipeline hook).
# Dashboards in dashboards/ query only those names.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

# External URL is a CLI flag, not a config key:
# --web.external-url=http://localhost:9090

# Retention is a CLI flag, not a config key:
# --storage.tsdb.retention.time=15d
# storage.tsdb.retention.time: 15d (read-only note)

scrape_configs:
  - job_name: forecast-ml
    metrics_path: /metrics
    static_configs:
      - targets: ['forecast-ml:8000']

  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ['otel-collector:8888']
