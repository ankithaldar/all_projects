# catalog.yml — gcp env overlay.
# GCP env overlay: filepaths are gs://${params:artifacts_bucket}/... and
# BigQuery credentials come from GOOGLE_APPLICATION_CREDENTIALS.
# Bucket: ${params:artifacts_bucket} is the flat artifacts_bucket param
# in conf/base/parameters/platform.yml (default 'forecast-ml-artifacts',
# matching infra/gcp var.artifacts_bucket). Override that one param —
# not these filepaths — to use a different bucket.
# Every key below overrides ONLY `filepath` vs base (same dataset
# names, same kedro_datasets.* types). Valid filepath: a GCS URI
# (gs://bucket/...) or local path; example:
# 'gs://${params:artifacts_bucket}/data/raw/x.csv'.
# *_params entries (Spark BQ, metrics) inherit from base catalog.
# WARNING: bucket is shared across runs — use env-specific buckets
# for production data.
# raw_data: CSV raw input. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: 'gs://${params:artifacts_bucket}/data/raw/raw_data.csv').
raw_data:
  type: 'kedro_datasets.pandas.CSVDataset'
  filepath: 'gs://${params:artifacts_bucket}/data/raw/raw_data.csv'
# raw_data_parquet: Parquet raw input. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: 'gs://${params:artifacts_bucket}/data/raw/raw_data.parquet').
raw_data_parquet:
  type: 'kedro_datasets.pandas.ParquetDataset'
  filepath: 'gs://${params:artifacts_bucket}/data/raw/raw_data.parquet'
# raw_data_regression: Regression raw input. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: 'gs://${params:artifacts_bucket}/data/raw/raw_data_regression.csv').
raw_data_regression:
  type: 'kedro_datasets.pandas.CSVDataset'
  filepath: 'gs://${params:artifacts_bucket}/data/raw/raw_data_regression.csv'
# processed_data: Processed frame. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: 'gs://${params:artifacts_bucket}/data/processed/processed_data.parquet').
processed_data:
  type: 'kedro_datasets.pandas.ParquetDataset'
  filepath: 'gs://${params:artifacts_bucket}/data/processed/processed_data.parquet'
# train_data: Train split. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: 'gs://${params:artifacts_bucket}/data/processed/train_data.parquet').
train_data:
  type: 'kedro_datasets.pandas.ParquetDataset'
  filepath: 'gs://${params:artifacts_bucket}/data/processed/train_data.parquet'
# test_data: Test split. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: 'gs://${params:artifacts_bucket}/data/processed/test_data.parquet').
test_data:
  type: 'kedro_datasets.pandas.ParquetDataset'
  filepath: 'gs://${params:artifacts_bucket}/data/processed/test_data.parquet'
# model: Fitted model. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: 'gs://${params:artifacts_bucket}/artifacts/models/model.pkl').
model:
  type: 'forecast_ml_framework.core.datasets.RestrictedPickleDataset'
  filepath: 'gs://${params:artifacts_bucket}/artifacts/models/model.pkl'
# calibration_model: Calibrated model. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: 'gs://${params:artifacts_bucket}/artifacts/models/calibration_model.pkl').
calibration_model:
  type: 'forecast_ml_framework.core.datasets.RestrictedPickleDataset'
  filepath: 'gs://${params:artifacts_bucket}/artifacts/models/calibration_model.pkl'
# h2o_automl_model: H2O AutoML model. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: 'gs://${params:artifacts_bucket}/artifacts/models/h2o_automl_model.pkl').
h2o_automl_model:
  type: 'forecast_ml_framework.core.datasets.RestrictedPickleDataset'
  filepath: 'gs://${params:artifacts_bucket}/artifacts/models/h2o_automl_model.pkl'
# xgboost_model: XGBoost model. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: 'gs://${params:artifacts_bucket}/artifacts/models/xgboost_model.pkl').
xgboost_model:
  type: 'forecast_ml_framework.core.datasets.RestrictedPickleDataset'
  filepath: 'gs://${params:artifacts_bucket}/artifacts/models/xgboost_model.pkl'
# lightgbm_model: LightGBM model. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: 'gs://${params:artifacts_bucket}/artifacts/models/lightgbm_model.pkl').
lightgbm_model:
  type: 'forecast_ml_framework.core.datasets.RestrictedPickleDataset'
  filepath: 'gs://${params:artifacts_bucket}/artifacts/models/lightgbm_model.pkl'
# catboost_model: CatBoost model. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: 'gs://${params:artifacts_bucket}/artifacts/models/catboost_model.pkl').
catboost_model:
  type: 'forecast_ml_framework.core.datasets.RestrictedPickleDataset'
  filepath: 'gs://${params:artifacts_bucket}/artifacts/models/catboost_model.pkl'
# sklearn_model: sklearn model. Overrides only filepath vs base
