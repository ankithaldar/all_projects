# catalog.yml — azure env overlay.
# Azure env overlay: filepaths are ${params:artifacts_blob_url}/... and
# Azure credentials come from the environment (ARM_* / Azure CLI).
# URL: ${params:artifacts_blob_url} is the Terraform artifacts_blob_url
# output (https://forecastmlartifacts.blob.core.windows.net, matching
# infra/azure var.artifacts_storage_account default
# 'forecastmlartifacts'). Override that one param — not these
# filepaths — to use a different account. ONE mechanism: every filepath
# below uses ${params:artifacts_blob_url}; no direct-URL alternative.
# Every key below overrides ONLY `filepath` vs base (same dataset
# names, same kedro_datasets.* types). Valid filepath: the
# ${params:artifacts_blob_url} interpolation; example:
# '${params:artifacts_blob_url}/data/raw/x.csv'.
# *_params entries inherit from base catalog.
# WARNING: account is shared across runs — use env-specific accounts
# for production data.
# raw_data: CSV raw input. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: '${params:artifacts_blob_url}/data/raw/raw_data.csv').
raw_data:
  type: 'kedro_datasets.pandas.CSVDataset'
  filepath: '${params:artifacts_blob_url}/data/raw/raw_data.csv'
# raw_data_parquet: Parquet raw input. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: '${params:artifacts_blob_url}/data/raw/raw_data.parquet').
raw_data_parquet:
  type: 'kedro_datasets.pandas.ParquetDataset'
  filepath: '${params:artifacts_blob_url}/data/raw/raw_data.parquet'
# raw_data_regression: Regression raw input. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: '${params:artifacts_blob_url}/data/raw/raw_data_regression.csv').
raw_data_regression:
  type: 'kedro_datasets.pandas.CSVDataset'
  filepath: '${params:artifacts_blob_url}/data/raw/raw_data_regression.csv'
# processed_data: Processed frame. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: '${params:artifacts_blob_url}/data/processed/processed_data.parquet').
processed_data:
  type: 'kedro_datasets.pandas.ParquetDataset'
  filepath: '${params:artifacts_blob_url}/data/processed/processed_data.parquet'
# train_data: Train split. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: '${params:artifacts_blob_url}/data/processed/train_data.parquet').
train_data:
  type: 'kedro_datasets.pandas.ParquetDataset'
  filepath: '${params:artifacts_blob_url}/data/processed/train_data.parquet'
# test_data: Test split. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: '${params:artifacts_blob_url}/data/processed/test_data.parquet').
test_data:
  type: 'kedro_datasets.pandas.ParquetDataset'
  filepath: '${params:artifacts_blob_url}/data/processed/test_data.parquet'
# model: Fitted model. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: '${params:artifacts_blob_url}/artifacts/models/model.pkl').
model:
  type: 'forecast_ml_framework.core.datasets.RestrictedPickleDataset'
  filepath: '${params:artifacts_blob_url}/artifacts/models/model.pkl'
# calibration_model: Calibrated model. Overrides only filepath vs base
