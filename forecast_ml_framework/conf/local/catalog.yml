# catalog.yml — local env overlay.
# Local env overlay: filepaths are ./data and ./artifacts.
# Use for laptop/dev runs; never for shared/cloud runs.
# Every key below overrides ONLY `filepath` vs base (same dataset
# names, same kedro_datasets.* types). Valid filepath: any local
# path the dataset class accepts; example: './data/raw/x.csv'.
# WARNING: relative paths resolve from the project root.
# raw_data: CSV raw input. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: './data/raw/raw_data.csv').
raw_data:
  type: 'kedro_datasets.pandas.CSVDataset'
  filepath: './data/raw/raw_data.csv'
# raw_data_parquet: Parquet raw input. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: './data/raw/raw_data.parquet').
raw_data_parquet:
  type: 'kedro_datasets.pandas.ParquetDataset'
  filepath: './data/raw/raw_data.parquet'
# raw_data_regression: Regression raw input. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: './data/raw/raw_data_regression.csv').
raw_data_regression:
  type: 'kedro_datasets.pandas.CSVDataset'
  filepath: './data/raw/raw_data_regression.csv'
# processed_data: Processed frame. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: './data/processed/processed_data.parquet').
processed_data:
  type: 'kedro_datasets.pandas.ParquetDataset'
  filepath: './data/processed/processed_data.parquet'
# train_data: Train split. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: './data/processed/train_data.parquet').
train_data:
  type: 'kedro_datasets.pandas.ParquetDataset'
  filepath: './data/processed/train_data.parquet'
# test_data: Test split. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: './data/processed/test_data.parquet').
test_data:
  type: 'kedro_datasets.pandas.ParquetDataset'
  filepath: './data/processed/test_data.parquet'
# model: Fitted model. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: './artifacts/models/model.pkl').
model:
  type: 'kedro_datasets.pickle.PickleDataset'
  filepath: './artifacts/models/model.pkl'
# calibration_model: Calibrated model. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: './artifacts/models/calibration_model.pkl').
calibration_model:
  type: 'kedro_datasets.pickle.PickleDataset'
  filepath: './artifacts/models/calibration_model.pkl'
# h2o_automl_model: H2O AutoML model. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: './artifacts/models/h2o_automl_model.pkl').
h2o_automl_model:
  type: 'kedro_datasets.pickle.PickleDataset'
  filepath: './artifacts/models/h2o_automl_model.pkl'
# xgboost_model: XGBoost model. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: './artifacts/models/xgboost_model.pkl').
xgboost_model:
  type: 'kedro_datasets.pickle.PickleDataset'
  filepath: './artifacts/models/xgboost_model.pkl'
# lightgbm_model: LightGBM model. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: './artifacts/models/lightgbm_model.pkl').
lightgbm_model:
  type: 'kedro_datasets.pickle.PickleDataset'
  filepath: './artifacts/models/lightgbm_model.pkl'
# catboost_model: CatBoost model. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: './artifacts/models/catboost_model.pkl').
catboost_model:
  type: 'kedro_datasets.pickle.PickleDataset'
  filepath: './artifacts/models/catboost_model.pkl'
# sklearn_model: sklearn model. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: './artifacts/models/sklearn_model.pkl').
sklearn_model:
  type: 'kedro_datasets.pickle.PickleDataset'
  filepath: './artifacts/models/sklearn_model.pkl'
# metrics: Metrics JSON. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: './artifacts/metrics/metrics.json').
metrics:
  type: 'kedro_datasets.json.JSONDataset'
  filepath: './artifacts/metrics/metrics.json'
# metrics_csv: Metrics CSV. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: './artifacts/metrics/metrics.csv').
metrics_csv:
  type: 'kedro_datasets.pandas.CSVDataset'
  filepath: './artifacts/metrics/metrics.csv'
# predictions: Predictions parquet. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: './artifacts/predictions/predictions.parquet').
predictions:
  type: 'kedro_datasets.pandas.ParquetDataset'
  filepath: './artifacts/predictions/predictions.parquet'
# predictions_csv: Predictions CSV. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: './artifacts/predictions/predictions.csv').
predictions_csv:
  type: 'kedro_datasets.pandas.CSVDataset'
  filepath: './artifacts/predictions/predictions.csv'
# shap_values: SHAP values parquet. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: './artifacts/shap/shap_values.parquet').
shap_values:
  type: 'kedro_datasets.pandas.ParquetDataset'
  filepath: './artifacts/shap/shap_values.parquet'
# shap_summary: SHAP summary JSON. Overrides only filepath vs base
# (valid: a filepath URI for this env; example: './artifacts/shap/shap_summary.json').
shap_summary:
  type: 'kedro_datasets.json.JSONDataset'
  filepath: './artifacts/shap/shap_summary.json'
