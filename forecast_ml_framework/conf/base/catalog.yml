# split_meta: split sizes / indices metadata from modeling split.
# Type: kedro.io.MemoryDataset.
split_meta:
  type: 'kedro.io.MemoryDataset'

# split_meta_raw: honest split meta from data_prep
# split_raw_data_with_meta (actual sampling_method,
# requested_method, shuffle, time_col). Consumed by the
# modeling presplit node, which merges it into split_meta
# as raw_* keys (R6). Type: kedro.io.MemoryDataset.
split_meta_raw:
  type: 'kedro.io.MemoryDataset'

# eda_summary: eda_summary node output dict.
# Type: kedro.io.MemoryDataset.
eda_summary:
  type: 'kedro.io.MemoryDataset'

# eda_report: eda_report node output dict.
