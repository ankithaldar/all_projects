  filepath: 'data/processed/preprocessed_data.parquet'

# train_data_selected: select_features output frame.
# Type: kedro_datasets.pandas.ParquetDataset.
train_data_selected:
  type: 'kedro_datasets.pandas.ParquetDataset'
  filepath: 'data/processed/train_data_selected.parquet'

# modeling_input: DEPRECATED (A9 split-first, breaking
# at 0.1.0). No pipeline produces or consumes it any
# more: data_prep splits raw data first and modeling
# consumes train_data_selected / test_data_selected
# (sampling_method='presplit'). Kept only so old
# catalogs/configs that reference the name still
# resolve; new code must not use it.
# Type: kedro_datasets.pandas.ParquetDataset.
modeling_input:
  type: 'kedro_datasets.pandas.ParquetDataset'
  filepath: 'data/processed/modeling_input.parquet'

# train_raw / test_raw: raw validated frames split by
# data_prep split_raw_data (split-first, A9).
# Type: kedro.io.MemoryDataset (in-memory; kedro-datasets
# 10.x ships no MemoryDataset, kedro core does).
train_raw:
  type: 'kedro.io.MemoryDataset'

test_raw:
  type: 'kedro.io.MemoryDataset'

# test_preprocessed_data: test_raw after replaying the
# train-fitted registry (apply_preprocess node).
# Type: kedro.io.MemoryDataset.
test_preprocessed_data:
  type: 'kedro.io.MemoryDataset'

# test_data_selected: test frame after applying the
# train-fitted feature selection (apply_selection
# node). Consumed with train_data_selected by the
# modeling presplit node.
# Type: kedro.io.MemoryDataset.
test_data_selected:
  type: 'kedro.io.MemoryDataset'

# x_train / x_test / y_train / y_test: modeling split outputs.
# Type: kedro.io.MemoryDataset (in-memory; kedro-datasets 10.x
# ships no MemoryDataset, kedro core does).
x_train:
