audit_log:
  type: 'kedro_datasets.pandas.ParquetDataset'
  filepath: 'artifacts/governance/audit_log.parquet'

# --- Clean-UX: pipeline intermediate datasets (Tasks 5) -------------------------
# validated_data: validated frame from data_prep validate_data node.
# Type: kedro_datasets.pandas.ParquetDataset.
validated_data:
  type: 'kedro_datasets.pandas.ParquetDataset'
  filepath: 'data/processed/validated_data.parquet'

# validation_report: validate_data report dict.
# Type: kedro_datasets.json.JSONDataset.
validation_report:
