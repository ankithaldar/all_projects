# --- Modeling pipeline outputs (persisted) ------------------------------------
# best_model: fitted model selected by train_models.
# Type: forecast_ml_framework.core.datasets.RestrictedPickleDataset.
best_model:
  type: 'forecast_ml_framework.core.datasets.RestrictedPickleDataset'
  filepath: 'artifacts/models/best_model.pkl'

# best_model_name: selected adapter name (str).
# Type: kedro_datasets.json.JSONDataset.
best_model_name:
  type: 'kedro_datasets.json.JSONDataset'
