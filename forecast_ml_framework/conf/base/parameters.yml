# parameters.yml — modelling + feature-engineering parameters (base defaults).
# Structure mirrors the reference vz_faas_framework_v2 conf/base/parameters.yml,
# plus feature-selection / multi-model / MLOps sections. Kedro env overlays
# (conf/local, conf/gcp, conf/aws) override only what they must.
# No credentials or secrets here — read them from the environment at runtime.

# --- Runtime params (catalog interpolations) ------------------------------------
# Flat keys referenced from catalog.yml as ${params:<key>} (Kedro params
# namespace). NEW keys for config_schema (extra=allow): score_model_id,
# output_gcs_location, model_id_prefix, suffix, data_project,
# db_staging_data, etl_project, etl_dataset, etl_table, external_project,
# tmp_bucket, is_domino, run_date, train_run_dt, score_run_dt, brand.
score_model_id: ${.global_params.score_model_id}
output_gcs_location: 'artifacts'
model_id_prefix: 'demo_model_v1'
suffix: 'v1'
data_project: ''
db_staging_data: ''
etl_project: ''
etl_dataset: ''
etl_table: ''
external_project: ''
tmp_bucket: ''
is_domino: false
run_date: ${.global_params.run_date}
train_run_dt: ${.global_params.run_date}
score_run_dt: ${.global_params.run_date}
brand: ''

# --- Run / global -------------------------------------------------------------
global_params:
  is_regression: false
  is_domino: false
  score_model_id: 'demo_model_v1'
  run_date: '2026-11-05'
  model_type: 'sklearn'
  random_state: 42
  target_col: ${variables.target_col}
  key_cols_list:
    - 'id'

# --- Data sources -------------------------------------------------------------
data_params:
  train_data: 'raw_data'          # catalog dataset name (see catalog.yml)
  test_data: 'raw_data'
  # Regression example: point prod at a continuous target column instead.
  # train_data: 'raw_data_regression'

# Sampling (classification): how the training set is subsampled.
# stratify_col: column whose distribution is preserved
# (valid: a column name; default: ${..global_params.target_col}).
# fractions: {class: fraction to keep} e.g. {0: 1.0, 1: 0.5}
# downsamples class 1 to half. sampling_type: 'stratified' |
# 'random'. WARNING: fractions < 1 change class balance and metrics.
# --- Sampling (classification) ------------------------------------------------
# Code contract (modeling_params.sampling_params):
# {method: stratified|random, test_size: float, stratify_col: str}
sampling_params:
  method: 'stratified'
  test_size: 0.2
  stratify_col: ${..global_params.target_col}

# --- Sampling (regression) ----------------------------------------------------
sampling_reg_params:
  method: 'random'
  test_size: 0.2
  stratify_col: ${..global_params.target_col}

# --- Spark -> pandas conversion ----------------------------------------------
pandas_conversion_params:
  convert_to_pandas: true
  category_cols: []

# Evaluation: metric names are plain strings resolved by the
# modeling worker. classification metrics: roc_auc |
# average_precision | f1 | precision | recall | mcc.
# regression metrics: rmse | mae | r2 | mape. prediction_col /
# prediction_probability_col name the output columns.
# --- Evaluation ---------------------------------------------------------------
evaluation_params:
  multiclass_flag: false
  prediction_col: 'xgboost_pred'
  prediction_probability_col: 'score_value'
  metrics:
    classification:
      - 'roc_auc'
      - 'average_precision'
      - 'f1'
    regression:
      - 'rmse'
      - 'mae'
      - 'r2'

# Train/test split: training_split_ratio + test_split_ratio should
# sum to 1. stratify_col preserves the target distribution
# (classification only; set null for regression). shuffle: true is
# required for stratified_random splits. random_state fixes the RNG.
# WARNING: changing ratios changes every downstream metric.
# --- Train / test split -------------------------------------------------------
train_test_split_params:
  training_split_ratio: 0.8
  test_split_ratio: 0.2
  stratify_col: ${..global_params.target_col}
  shuffle: true
  random_state: 42

# --- Data preparation: ordered FE registry -----------------------------------
# Steps run in list order. Each step: skip=false to enable, set args.cols to
# the columns it should act on (empty include_cols = no-op / all, per impl).
# Steps mapping to a real importable class carry `handle:` (dotted
# importable string resolved via importlib in data_prep.resolve_handle).
# Steps with no single importable class keep the step name + note and are
# implemented directly in pipelines/data_prep/nodes.py (CapOutliers,
# HighLabelBinning, FixedLength, Slope, Similarity, Sequence*).
data_prep_params:
  - Imputations:
      skip: false
      args:
        handle: 'sklearn.impute.SimpleImputer'
        strategy: 'median'
        custom_bounds: {}
        cols:
          exclude_cols: []
          include_cols: ['age', 'income', 'tenure_days', 'purchase_count']
  - Imputations:
      skip: false
      args:
        handle: 'sklearn.impute.SimpleImputer'
        strategy: 'mode'
        custom_bounds: {}
        cols:
          exclude_cols: []
          include_cols: ['region', 'plan_type', 'channel']
  # Note: no single importable class; implemented in data_prep nodes.
  - CapOutliers:
      skip: true
      args:
        method: 'bound'
        custom_bound: {}
        cols:
          exclude_cols: []
          include_cols: []
        bound:
          lower: 0.01
          upper: 0.99
  - QuantileDiscretizer:
      skip: true
      args:
        handle: 'pyspark.ml.feature.QuantileDiscretizer'
        params:
          numBuckets: 20
          relativeError: 0.001
          handleInvalid: 'error'
        cols:
          exclude_cols: []
          include_cols: []
  - Normalizations:
      skip: true
      args:
        handle: 'pyspark.ml.feature.MinMaxScaler'
        cols:
          exclude_cols: []
          include_cols: []
  # Note: no single importable class; implemented in data_prep nodes.
  - HighLabelBinning:
      skip: true
      args:
        val_count: 300
        cols:
          exclude_cols: []
          include_cols: ['region']
  - CategoricalEncoding:
      skip: false
      args:
        label_encode_handle: 'pyspark.ml.feature.StringIndexer'
        label_encode_params:
          handleInvalid: 'keep'
        ohe_handle: 'pyspark.ml.feature.OneHotEncoder'
        ohe_params:
          handleInvalid: 'keep'
        ohe_flag: true
        cols:
          exclude_cols: []
          include_cols: ['region', 'plan_type', 'channel']
  - TargetEncoding:
      skip: true
      args:
        handle: 'sklearn.preprocessing.TargetEncoder'
        smoothing: 10
        cols:
          exclude_cols: []
          include_cols: ['region']
  - FixedLength:
      skip: true
      args:
        fixed_length: 6
        cols:
          exclude_cols: []
          include_cols: ['monthly_spend_seq']
  - Slope:
      skip: true
      args:
        order: 1
        suffix: 'slope'
        last_n_val: 2
        cols:
          exclude_cols: []
          include_cols: ['monthly_spend_seq']
  - Similarity:
      skip: true
      args:
        rational_vector_map: {}
        last_n_val: 2
        cols:
          exclude_cols: []
          include_cols: ['monthly_spend_seq']
  - SequenceAverage:
      skip: true
      args:
        last_n_val: 2
        cols:
          exclude_cols: []
          include_cols: ['monthly_spend_seq']
  - SequenceMin:
      skip: true
      args:
        last_n_val: 2
        cols:
          exclude_cols: []
          include_cols: ['monthly_spend_seq']
  - SequenceMax:
      skip: true
      args:
        last_n_val: 2
        cols:
          exclude_cols: []
          include_cols: ['monthly_spend_seq']
  - SequenceLast:
      skip: true
      args:
        cols:
          exclude_cols: []
          include_cols: ['monthly_spend_seq']
  - SequenceDelta:
      skip: true
      args:
        last_n_val: 2
        cols:
          exclude_cols: []
          include_cols: ['monthly_spend_seq']
  - SequenceNormalize:
      skip: true
      args:
        round_off: 3
        cols:
          exclude_cols: []
          include_cols: ['monthly_spend_seq']

# Feature selection: methods run in order; each method has
# name (variance_threshold | mutual_info | rf_importance |
# shap_importance | correlation), enabled (true|false) and params.
# variance_threshold.threshold: minimum variance to keep (0.0 keeps
# all non-constant). mutual_info.k: top-k by mutual information.
# rf_importance.threshold: minimum RF importance. shap_importance.
# top_k: top-k SHAP features. correlation.threshold: drop one of
# each pair with |corr| above it (0.95). output: dataset name for
# the selected feature list. Business/override/exclude rules live
# in variables.yml and always apply.
# --- Feature selection --------------------------------------------------------
# Code contract (data_prep.nodes.select_features): flat keys
# variance_threshold/missing_threshold, correlation/kbest/l1/tree
# dicts {enabled, ...}, plus core feature-list keys honoured via
# ConfigLoader.merged_feature_list (business_features /
# override_features / exclude_features).
feature_selection_params:
  enabled: true
  random_state: 42
  is_regression: false
  variance_threshold: 0.0
  missing_threshold: 0.5
  correlation:
    enabled: false
    threshold: 0.95
  kbest:
    enabled: false
    k: 20
    score_func: 'f_classif'
  l1:
    enabled: false
    alpha: 0.01
    C: 1.0
  tree:
    enabled: false
    n_estimators: 200
    threshold: 0.01
  business_features: []
  override_features: []
  exclude_features: []
  output: 'selected_features'

# Models to train: any subset of h2o_automl | xgboost | lightgbm |
# catboost | sklearn. Removing a name skips that model entirely;
# per-model params live in modeling_params.model_params.<name>.
# --- Models to train ----------------------------------------------------------
models_to_use:
  - 'h2o_automl'
  - 'xgboost'
  - 'lightgbm'
  - 'catboost'
  - 'sklearn'

# H2O AutoML: max_models caps the leaderboard size; max_runtime_secs
# caps wall time (WARNING: large values cost real compute).
# include_algos/exclude_algos filter base learners (GBM, XGBoost,
# DeepLearning, GLM, RandomForest). sort_by: AUC (classification) |
# RMSE (regression). nfolds/stopping_rounds control CV.
# --- H2O AutoML ---------------------------------------------------------------
h2o_automl_params:
  max_models: 10
  max_runtime_secs: 600
  seed: 42
  nfolds: 5
  sort_by: 'AUC'
  include_algos:
    - 'GBM'
    - 'XGBoost'
    - 'DeepLearning'
    - 'GLM'
    - 'RandomForest'
  exclude_algos: []
  stopping_rounds: 5
  verbosity: 'info'

# --- Modelling (classification) ----------------------------------------------
# Loss functions (how to change the optimisation objective):
# Exact contract (modeling worker LOSS_REGISTRY):
# - modeling_params.loss_function: top-level default, plain string,
#   e.g. 'logloss'. No loss_function key = defaults unchanged.
# - model_params.<name>.loss_function: per-model override for
#   sklearn / xgboost / lightgbm / catboost / h2o_automl.
# - objective: native xgboost/lightgbm key (adapter maps
#   loss_function onto it; both are shipped below as examples).
# - Custom callable: a dotted importable string, e.g.
#   loss_function: 'my_losses.my_weighted_logloss' (commented
#   example; must be importable via importlib and callable).
# Valid sets (aliases logloss / squared_error|mse|rmse / mae /
# poisson / gamma / tweedie / huber / quantile / binary are
# case-insensitive):
#   sklearn: log_loss, squared_error, absolute_error, huber,
#     quantile, epsilon_insensitive, poisson, gamma, tweedie,
#     hinge, squared_hinge, modified_huber, perceptron, exponential
#   xgboost: binary:logistic, reg:squarederror, reg:gamma,
#     reg:tweedie, reg:absoluteerror, count:poisson, reg:logistic,
#     multi:softprob, multi:softmax, reg:pseudohubererror
#   lightgbm: binary, regression, regression_l1, huber, fair,
#     poisson, gamma, tweedie, quantile, multiclass, multiclassova,
#     xentropy, lambdarank, rank_xendcg
#   catboost: Logloss, RMSE, MAE, Poisson, Gamma, Tweedie, Quantile,
#     Huber, Fair, Hinge, CrossEntropy
#   h2o_automl: logloss, squared_error, absolute_error, poisson,
#     gamma, tweedie, huber, quantile
# Code contract (pipelines/modeling/pipeline.py): modeling_params
# holds task_type/target_col/models_to_use, model_params
# per adapter name, calibration{method,cv}, sampling_params
# {method,test_size,stratify_col}, shap_params. model_handle /
# calibration_handle / tuning_handle are dotted importables.
modeling_params:
  task_type: 'classification'
  target_col: 'target'
  feature_cols: null
  models_to_use:
    - 'h2o_automl'
    - 'xgboost'
    - 'lightgbm'
    - 'catboost'
    - 'sklearn'
  selection_metric: 'f1_weighted'
  random_state: 42
  test_size: 0.2
  sampling_params:
    method: 'stratified'
    test_size: 0.2
    stratify_col: 'target'
  calibration:
    method: 'betacal'
    cv: 5
  model_handle: 'xgboost.XGBClassifier'
  calibration_handle: 'sklearn.calibration.CalibratedClassifierCV'
  tuning_handle: 'sklearn.model_selection.GridSearchCV'
  # Default loss for all models below (valid: see header comment).
  loss_function: 'logloss'
  model_params:
    xgboost:
      model_handle: 'xgboost.XGBClassifier'
      n_estimators: 300
      max_depth: 5
      learning_rate: 0.05
      gamma: 1
      reg_lambda: 0.8
      subsample: 0.8
      colsample_bytree: 0.8
      eval_metric: 'aucpr'
      booster: 'gbtree'
      objective: 'binary:logistic'
      loss_function: 'binary:logistic'
      tree_method: 'hist'
      random_state: 42
    lightgbm:
      model_handle: 'lightgbm.LGBMClassifier'
      n_estimators: 300
      max_depth: -1
      learning_rate: 0.05
      num_leaves: 31
      objective: 'binary'
      loss_function: 'binary'
      random_state: 42
    catboost:
      model_handle: 'catboost.CatBoostClassifier'
      iterations: 500
      depth: 6
      learning_rate: 0.05
      loss_function: 'Logloss'
      random_state: 42
    sklearn:
      model_handle: 'sklearn.ensemble.RandomForestClassifier'
      n_estimators: 300
      loss_function: 'log_loss'
      random_state: 42
    h2o_automl:
      max_models: 10
      max_runtime_secs: 600
      seed: 42
      nfolds: 5
      sort_by: 'AUC'
      loss_function: 'logloss'
  bucket_segment_col: 'region'
  shap_params:
    method: 'shap'
    n_repeats: 5
    sample_rows: 100
    random_state: 42

# --- Modelling (regression) ---------------------------------------------------
modeling_reg_params:
  task_type: 'regression'
  target_col: 'target'
  feature_cols: null
  models_to_use:
    - 'h2o_automl'
    - 'xgboost'
    - 'lightgbm'
    - 'catboost'
    - 'sklearn'
  selection_metric: 'rmse'
  random_state: 42
  test_size: 0.2
  sampling_params:
    method: 'random'
    test_size: 0.2
    stratify_col: 'target'
  calibration:
    method: 'none'
    cv: 5
  model_handle: 'xgboost.XGBRegressor'
  calibration_handle: 'sklearn.calibration.CalibratedClassifierCV'
  tuning_handle: 'sklearn.model_selection.GridSearchCV'
  # Default loss for all models below (valid: see header comment).
  loss_function: 'squared_error'
  model_params:
    xgboost:
      model_handle: 'xgboost.XGBRegressor'
      n_estimators: 200
      max_depth: 6
      learning_rate: 0.05
      gamma: 1
      subsample: 0.8
      colsample_bytree: 0.8
      eval_metric: 'rmse'
      booster: 'gbtree'
      objective: 'reg:squarederror'
      loss_function: 'reg:squarederror'
      tree_method: 'hist'
      random_state: 42
    lightgbm:
      model_handle: 'lightgbm.LGBMRegressor'
      n_estimators: 200
      learning_rate: 0.05
      num_leaves: 31
      objective: 'regression'
      loss_function: 'regression'
      random_state: 42
    catboost:
      model_handle: 'catboost.CatBoostRegressor'
      iterations: 500
      depth: 6
      learning_rate: 0.05
      loss_function: 'RMSE'
      random_state: 42
    sklearn:
      model_handle: 'sklearn.ensemble.RandomForestRegressor'
      n_estimators: 200
      loss_function: 'squared_error'
      random_state: 42
    h2o_automl:
      max_models: 10
      max_runtime_secs: 600
      seed: 42
      nfolds: 5
      sort_by: 'RMSE'
      loss_function: 'squared_error'
  bucket_segment_col: 'region'
  shap_params:
    method: 'shap'
    n_repeats: 5
    sample_rows: 100
    random_state: 42

# --- Per-model params (used when models_to_use has >1 entry) -----------------
model_params_by_name:
  xgboost:
    model_handle: 'xgboost.XGBClassifier'
    n_estimators: 300
    max_depth: 5
    learning_rate: 0.05
    objective: 'binary:logistic'
    loss_function: 'binary:logistic'
  lightgbm:
    model_handle: 'lightgbm.LGBMClassifier'
    n_estimators: 300
    max_depth: -1
    learning_rate: 0.05
    num_leaves: 31
    objective: 'binary'
    loss_function: 'binary'
  catboost:
    model_handle: 'catboost.CatBoostClassifier'
    iterations: 500
    depth: 6
    learning_rate: 0.05
    loss_function: 'Logloss'
  sklearn:
    model_handle: 'sklearn.ensemble.RandomForestClassifier'
    n_estimators: 300
    loss_function: 'log_loss'
    random_state: 42

# Calibration (standalone section): enabled: true|false.
# method: sigmoid | isotonic | betacal | none. handle: dotted
# importable calibration class (e.g.
# sklearn.calibration.CalibratedClassifierCV). cv: folds for
# CalibratedClassifierCV. WARNING: calibration needs out-of-fold
# probabilities; too few positives per fold breaks isotonic.
# --- Calibration --------------------------------------------------------------
calibration_params:
  enabled: true
  method: 'betacal'
  cv: 5
  handle: 'betacal.BetaCalibration'
  params:
    parameters: 'abm'

# Cross-validation: n_splits (default 5), shuffle, random_state,
# scoring (roc_auc | f1 | rmse ...), strategy (stratified_kfold |
# kfold). WARNING: n_splits too high on small data fails.
# --- Cross-validation ---------------------------------------------------------
cv_params:
  n_splits: 5
  shuffle: true
  random_state: 42
  scoring: 'roc_auc'
  strategy: 'stratified_kfold'

# Spark: master 'local[*]' for local runs; app_name labels the app.
# spark.* keys are passed as SparkConf entries (shuffle partitions,
# driver memory). jar_packages lists extra JDBC jars. WARNING:
# driver.memory too small OOMs large shuffles.
# --- Spark --------------------------------------------------------------------
spark_params:
  master: 'local[*]'
  app_name: 'forecast-ml-framework'
  spark:
    spark.sql.shuffle.partitions: 200
    spark.driver.memory: '4g'
  jar_packages: []

# Artifact store: type local | gcp | s3 (env overlays override).
# base_path (local) / bucket (gcp|s3) locate artifacts. versioning
# enables dataset versioning. WARNING: bucket/base_path are shared
# across runs in an env — point them at env-specific locations.
# --- Artifact store (type overridden per env: local / gcp / aws) -------------
artifact_store_params:
  type: 'local'
  base_path: 'artifacts'
  # gcp: gs://forecast-ml-artifacts | aws: s3://forecast-ml-artifacts
  bucket: ''
  versioning: true

# MLflow: tracking_uri (local 'mlruns' or a server URI),
# experiment_name, registry_uri ('' = no registry). log_params /
# log_metrics / log_artifacts toggle what is recorded.
# --- MLflow -------------------------------------------------------------------
mlflow_params:
  tracking_uri: 'mlruns'
  experiment_name: 'forecast-ml-framework'
  registry_uri: ''
  log_params: true
  log_metrics: true
  log_artifacts: true

# DVC: enabled: true|false. remote: named DVC remote, remote_url:
# its URL ('' = none). push_on_run pushes data after each run.
# WARNING: push_on_run in CI needs credentials in the environment.
# --- DVC ----------------------------------------------------------------------
dvc_params:
  enabled: true
  remote: 'local'
  remote_url: ''
  push_on_run: false

# SHAP: enabled: true|false. explainer: TreeExplainer (tree
# models) | KernelExplainer (model-agnostic, slow). WARNING:
# KernelExplainer on large data is very slow.
# --- SHAP ---------------------------------------------------------------------
shap_params:
  enabled: true
  explainer: 'TreeExplainer'
  background_size: 100
  top_k: 20
  output_dir: 'artifacts/shap'

# --- Charts -------------------------------------------------------------------
chart_params:
  enabled: true
  output_dir: 'artifacts/charts'
  figure_size:
    - 10
    - 6
  dpi: 150
  charts:
    - 'confusion_matrix'
    - 'roc_curve'
    - 'feature_importance'
    - 'calibration_curve'

# Validation (validate_data node): enabled: true|false.
# fail_on_missing_columns / fail_on_null_target: hard-fail instead
# of warn. min_train_rows / min_test_rows: minimum sizes.
# check_target_range {min, max}: expected target bounds.
# drift_check: enable distribution drift checks (costs a pass).
# --- Validation ---------------------------------------------------------------
# Code contract (data_prep.nodes.validate_data):
# {fail_fast, required_cols, max_null_ratio}
validation_params:
  fail_fast: false
  required_cols: []
  max_null_ratio: 0.5
