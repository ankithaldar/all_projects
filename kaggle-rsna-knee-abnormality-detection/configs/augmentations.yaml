# Albumentations pipelines. Instantiated via augmentations.factory.build_compose.
train:
  - class_path: albumentations.Affine
    init_params:
      scale: [0.9, 1.1]
      translate_percent: {x: [-0.05, 0.05], y: [-0.05, 0.05]}
      rotate: [-10, 10]
      border_mode: 0
      p: 0.75
  - class_path: albumentations.RandomBrightnessContrast
    init_params:
      brightness_limit: 0.1
      contrast_limit: 0.1
      p: 0.5
  - class_path: albumentations.RandomGamma
    init_params:
      gamma_limit: [80, 120]
      p: 0.3
  - class_path: albumentations.GaussNoise
    init_params:
      var_limit: [10.0, 50.0]
      p: 0.2
  - class_path: albumentations.GaussianBlur
    init_params:
      blur_limit: [3, 5]
      p: 0.15

valid: []
infer: []
