# Root configuration for the RSNA knee abnormality detection MVP.
# All values consumed by main.py and the src/knee packages live here or in sibling files.
experiment:
  name: mvp_efnv2s_384_k24_5f
  seed: 42
  output_dir: /kaggle/working

paths:
  # Competition mount verified in notebooks/01_EDA.ipynb.
  competition_dir: /kaggle/input/competitions/rsna-knee-abnormality-detection
  train_csv: ${paths.competition_dir}/train.csv
  train_series_csv: ${paths.competition_dir}/train_series.csv
  train_dicom_dir: ${paths.competition_dir}/train_series
  test_csv: ${paths.competition_dir}/test.csv
  test_series_csv: ${paths.competition_dir}/test_series.csv
  test_dicom_dir: ${paths.competition_dir}/test_series
  index_parquet: ${paths.artifact_dir}/index.parquet
  test_index_parquet: ${paths.artifact_dir}/index_test.parquet
  labels_csv: ${paths.artifact_dir}/labels_pseudo.csv
  folds_csv: ${paths.artifact_dir}/folds.csv
  artifact_dir: /kaggle/working/artifacts
  checkpoint_dir: /kaggle/working/checkpoints
  oof_dir: /kaggle/working/oof
  log_dir: /kaggle/working/logs
  copy_dir: /kaggle/tmp/cache_roots  # local-SSD shard mirror (large disk)
  # Sharded HDF5 pixel cache built by `main.py build-cache`. Split
  # 'shard' pushes each finished shard as its own dataset from the
  # completion callback (peak disk ~2 shards), fitting the mandated
  # /kaggle/working/build_cache path; 'group' accumulates then splits.
  volume_cache_dir: /kaggle/working/build_cache

resume:
  enabled: true
  # Kaggle Dataset slugs pushed/pulled by helpers.kaggle_io between sessions.
  index_dataset_slug: rsna-knee-mvp-index
  checkpoint_dataset_slug: rsna-knee-mvp-ckpt
  # Volume cache base name: shard mode appends -000/-001/... per shard;
  # fully-qualified owner/name values pass through unchanged.
  cache_dataset_slug: ah2002-rsna-knee-abnormality-detection-cache
  cli_retries: 3                # kaggle CLI attempts per invocation
  cli_backoff_seconds: 2.0      # linear backoff between attempts
  push_slug_gib_cap: 95         # group-mode split ceiling per dataset

kaggle_secrets:
  username_key: KAGGLE_USERNAME
  token_key: KAGGLE_API_TOKEN

# Experiment-tracking integrations. All credentials resolve through
# knee.helpers.secrets: os.environ -> .env -> Kaggle User Secrets.
integrations:
  discord:
    enabled: true
    webhook_secret: DISCORD_WEBHOOK_URL
    every_n_steps: 10              # heartbeat cadence (optimizer steps)
    min_post_interval_s: 2.5       # rate-limit between webhook posts
    request_timeout_s: 10.0
    traceback_snippet_chars: 1500  # crash-message truncation
    first_step_ping: true          # pace signal at step 1, not step 50
  wandb:
    enabled: true
    project: rsna-knee-mvp
    entity: null                   # team name or null for personal account
    api_key_secret: WANDB_API_KEY
    mode: null                     # null = online when key exists, else offline

run:
  # Folds processed by `main.py train` in this session, in order.
  folds: [0, 1, 2, 3, 4]

# Noise-floor study (BLUEPRINT 11.0-1): the SAME config trained at every
# seed on the listed folds; final-epoch OOF macro-AUC spread defines the
# keep/drop gate (mean + 2*std) for ALL backlog experiments. Progress is
# resumable (noise_floor_state.json) and per-seed checkpoints push to
# their own dataset so the main checkpoint slug stays untouched.
noise_floor:
  seeds: [42, 43, 44]            # blueprint: 3 seeds x best config
  folds: [0]                     # blueprint: fold 0 only
  dataset_slug: rsna-knee-mvp-nf # per-seed ckpts + state/summary files
  budget_floor_h: 0.5            # skip the next seed below this remainder

# Production logging: one flat <stage>_<experiment>_<UTC>.log per run
# under paths.log_dir capturing python logging + mirrored stdout/stderr
# (tqdm bars, Lightning prints, raw tracebacks).
logging:
  level: INFO
  capture_streams: true
  progress:
    enabled: true
    refresh_rate: 25               # tqdm bar refresh (batches)
    gpu_mem: true                  # per-line GPU memory snapshot

# Preflight selftest scope (engines.selftest). Tiny on purpose: the
# goal is plumbing verification in minutes, not accuracy.
selftest:
  sample_series: 8               # dicom_mount probe breadth
  studies: 4                     # 2 train + 2 valid in the mini fit
  train_batches: 2
  val_batches: 1

# HDF5 volume cache policy (helpers.h5_cache). Shards cap at 10 GiB of
# uncompressed pixels each; gzip runs per-chunk inside the container so
# local shard files already reflect final upload size.
volume_cache:
  enabled: true                  # build-cache writer + reader swap gate
  split_mode: shard              # shard => per-shard datasets <base>-NNN
  shard_gib_cap: 10
  gzip_level: 4
  scan_workers: 4                # decode pool width (CPU-bound stage)
  pool_chunksize: 2              # series per pool.map task
  log_every_series: 50           # console progress cadence
  discord_files_every: 100000    # heartbeat cadence in DICOM frames
