# =============================================================================
# base.yaml -- canonical defaults; experiment YAMLs override via merge.
# Every swappable component uses {target: class.path, params: {...}} so
# behaviour changes are config-only (Dependency Inversion).
# =============================================================================
name: baseline_2p5d_effnetv2
seed: 42

paths:
  data_root: ${oc.env:DATA_ROOT,/kaggle/input/competitions/rsna-knee-abnormality-detection}
  train_csv: train.csv
  train_series_csv: train_series.csv
  train_series_dir: train_series
  test_csv: test.csv
  test_series_csv: test_series.csv
  test_series_dir: test_series
  # Kaggle disk (30 GB) cannot hold a cache of the ~570 GB DICOM tree, so
  # volumes STREAM from the read-only mount by default. Point this at one
  # dir -- or os.pathsep-joined optional npz shards built by
  # scripts/prepare_volumes.py -- to use them as a read-only accelerator;
  # misses fall back to live decode.
  volumes_cache: null
  folds_csv: train_folds.csv
  weak_labels_parquet: null      # e.g. /kaggle/input/knee-weak-labels-v1/weak_labels.parquet
  checkpoints_dir: checkpoints   # resolved under output_dir at runtime
  predictions_dir: predictions
  output_dir: /kaggle/working

data:
  num_slices: 32                 # slices sampled per series
  image_size: 384
  percentile_clip: [1.0, 99.0]
  in_chans: 32                   # channel-stacked slices for 2.5D encoders
  min_series_slices: 5           # drop localizer series
  cache_format: npz

augment:
  train:
    - target: albumentations.RandomResizedCrop
      params: { size: [384, 384], scale: [0.7, 1.0], ratio: [0.9, 1.1], p: 1.0 }
    - target: albumentations.Affine
      params: { rotate: [-12, 12], translate_percent: { x: [-0.05, 0.05], y: [-0.05, 0.05] }, p: 0.7 }
      # NOTE: no HorizontalFlip anywhere - L/R flip breaks Medial/Lateral OA targets.
    - target: albumentations.RandomBrightnessContrast
      params: { brightness_limit: 0.15, contrast_limit: 0.15, p: 0.5 }
    - target: albumentations.RandomGamma
      params: { gamma_limit: [80, 120], p: 0.5 }
    - target: albumentations.GaussNoise
      params: { std_range: [0.05, 0.1], p: 0.2 }
    - target: albumentations.CoarseDropout
      params: { max_holes: 4, max_height: 32, max_width: 32, p: 0.3 }
  valid:
    - target: albumentations.Resize
      params: { height: 384, width: 384, p: 1.0 }
  diff_ops: []                   # GPU diff-augment subset of ['color','translation','cutout']

model:
  encoder:
    target: knee.models.encoders.TimmSeriesEncoder
    params:
      model_name: tf_efficientnetv2_s.in21k_ft_in1k
      pretrained: true
      in_chans: 32
      drop_path_rate: 0.2
      global_pool: avg
  aggregator:
    target: knee.layers.aggregators.AttentionMILAggregator
    params: { feat_dim: 1280, hidden_dim: 512, dropout: 0.1 }
  metadata_encoder:
    target: knee.layers.metadata_encoder.MetadataEncoder
    params: { out_dim: 64, activation: silu }
  n_targets: 12
  head_dropout: 0.1

loss:
  criterion:
    target: knee.losses.classification.AsymmetricLoss
    params: { gamma_neg: 2.0, gamma_pos: 0.2, clip: 0.05 }
  distill_weight: 0.5            # ramped by trainer across epochs
  distill_temperature: 2.0
  dynamic_weights: false         # true -> DWA auto-balances sup vs distill terms

optimizer:
  optimizer:
    target: torch.optim.AdamW
    params: { lr: 2.0e-4, weight_decay: 1.0e-2 }
  scheduler:
    target: knee.optimizers.param_groups_scheduler.WarmupCosineScheduler
    params: { warmup_epochs: 1.0, min_lr_scale: 0.01 }
  scheduler_step_on: epoch
  backbone_lr_scale: 0.25        # differential lr: backbone slower than head
  # backbone_optimizer:           # set to enable manual (dual) optimization
  #   target: torch.optim.SGD
  #   params: { lr: 1.0e-4, momentum: 0.9 }
  # lookahead:
  #   target: knee.optimizers.lookahead.Lookahead
  #   params: { k: 5, alpha: 0.5 }

sampler:
  sampler:
    target: knee.datasets.sampler.BalancedMultiLabelSampler
    params: { oversample_cap: 8.0 }

# Flat wiring consumed by knee.datamodules.knee_datamodule.KneeDataModule
# (constructed explicitly by scripts/train_image_student.py / infer.py).
# Host-RAM rule of thumb: batch ~ bs x 6 x 32 x 384^2 x 4B (~450 MB at
# bs=4); loader keeps ~(workers x prefetch + 1) of those. Kaggle pods
# have ~13-15 GB shared by TWO DDP ranks when devices=2 -- the defaults
# below keep a single-rank run comfortably inside that envelope.
datamodule:
  batch_size: 4                 # studies per step
  num_workers: 2
  max_series_per_study: 6
  pin_memory: false             # pinned staging doubles big-batch copies
  prefetch_factor: 2
  persistent_workers: true      # keeps each worker's warm LRU alive
  # Per-worker LRU for stream-decoded volumes (no disk cache on Kaggle):
  # host RAM ~ num_workers x lru_max_gb -- stay inside Kaggle's ~13-15 GB.
  lru_max_volumes: 64           # ~64 x 4.7 MB uint8 volumes per worker
  lru_max_gb: 2                 # byte ceiling per worker

train:
  fold_scheme: iterative_multilabel
  n_folds: 5
  train_folds: [0, 1, 2, 3, 4]
  label_source: mixed             # gold hard labels + weak soft labels
  resume: false                   # auto-resume folds from latest/W&B checkpoint
  time_budget_hours: null         # e.g. 11 -> Lightning max_time cap (12 h kernel limit)
  grad_noise: 0.0                 # >0 enables GradientNoiseInjector(eta)
  amp_fallback: false             # restart fit in fp32 on AMP divergence
  grad_clip: null                 # e.g. {target: knee.optimizers.gradients.AdaptiveClipping, params: {multiplier: 1.5}}
  curriculum: null                # e.g. {target: knee.losses.curriculum_weights.ConfidenceRampCurriculum,
                                  #        params: {start_floor: 0.9, hold_epochs: 2, ramp_epochs: 4}}
  trainer:
    target: lightning.pytorch.Trainer
    params:
      max_epochs: 12
      accelerator: auto
      devices: 1                    # DDP on T4x2 doubles host RAM; opt in
                                    # (devices: auto) only if memory allows
      precision: bf16-mixed
      accumulate_grad_batches: 8    # bs=4 x accum 8 = effective batch 32
      gradient_clip_val: 10.0
      log_every_n_steps: 10          # streamed cells: show life signs often
      enable_progress_bar: false     # tqdm spam in non-TTY stdout; metric
                                     # lines + decode summaries tell the story
      check_val_every_n_epoch: 1
      deterministic: false
  callbacks:
    - target: lightning.pytorch.callbacks.ModelCheckpoint
      params: { monitor: val_macro_auc, mode: max, save_top_k: 1, save_last: true, filename: "{epoch}-{val_macro_auc:.4f}" }
      # save_last -> fold<N>/last.ckpt carries exact optimizer/EMA state
      # so a fold interrupted by the 12 h kernel wall resumes epoch-level.
    - target: lightning.pytorch.callbacks.LearningRateMonitor
      params: { logging_interval: epoch }              # per-group LRs into the logger
    - target: lightning.pytorch.callbacks.EarlyStopping
      params: { monitor: val_macro_auc, mode: max, patience: 3 }
    - target: knee.callbacks.ema_discord.EMACallback
      params: { decay: 0.999, swap_at_validation: true }
    - target: knee.callbacks.ema_discord.DiscordCallback   # no-op without DISCORD_WEBHOOK_URL
      params: { notify_every_epochs: 1, report_best: true, include_train_loss: false }
    # --- optional optimization enhancements (all default-off) ------------
    # - target: knee.callbacks.adaptivity.AdaptiveBatchSizeCallback
    #   params: { target_fraction: 0.55, max_size: 32 }
    # - target: knee.callbacks.adaptivity.SmartAccumulationCallback
    #   params: { low_fraction: 0.35, high_fraction: 0.85 }
    # - target: knee.callbacks.adaptivity.OnlineHPTuner
    #   params: { patience: 2, lr_decay: 0.5, max_reductions: 3 }
    # - target: knee.callbacks.stability.ProgressiveUnfreezingCallback
    #   params: { rules: [{ pattern: encoder., until_epoch: 2 }] }
    # - target: knee.callbacks.swapping.ComponentSwapCallback
    #   params:
    #     schedule:
    #       - epoch: 6
    #         attribute: aggregator
    #         spec:
    #           target: knee.layers.aggregators.TransformerAggregator
    #           params: { feat_dim: 1280, hidden_dim: 512, num_layers: 2, num_heads: 8 }
  loggers:
    # Always-on local logger: metrics CSV under output_dir/logs/<name>/foldN
    - target: lightning.pytorch.loggers.CSVLogger
      params: { save_dir: logs }
    # Cloud tracking; silently dropped unless NEPTUNE_API_TOKEN + NEPTUNE_PROJECT resolve
    # from .env / environment / Kaggle Secrets (loader hydrates os.environ pre-resolve).
    - target: lightning.pytorch.loggers.NeptuneLogger
      params:
        project: ${oc.env:NEPTUNE_PROJECT,''}
        api_key: ${oc.env:NEPTUNE_API_TOKEN,''}
        log_model_checkpoints: false
        tags: [rsna-knee]

tta:
  enabled: true
  vertical_flip: true            # safe: preserves medial/lateral laterality
  slice_reversal: true
  multi_scale: [384]
