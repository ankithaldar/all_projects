# Experiment: mvp_efnv2s_384_k24_5f
# First full MVP run. Defaults below are deep-merged from configs/<stem>.yaml
# in order, then this file's `override` section is applied on top.
# The engine dumps the resolved config next to artifacts for traceback.
defaults:
  - config
  - data
  - folds
  - augmentations
  - model
  - loss
  - optimizer
  - train
  - datamodule
  - infer

override:
  experiment:
    name: mvp_efnv2s_384_k24_5f

  # Compute budget (BLUEPRINT Section 8): 423k slice-forwards/epoch,
  # ~20-25 min on 2xT4 -> 4 epochs x 5 folds ~= 7-12 GPU-h.
  trainer:
    init_params:
      max_epochs: 4
      accumulate_grad_batches: 2

  scheduler:
    init_params:
      T_max: 4

  data:
    n_slices: 24
    img_size: 384

  series_selection:
    max_series_per_study: 4

  # 14.5 GB T4 budget: batch_size 3 x 4 series x 24 slices = 288 images
  # per pass, split into chunked backbone passes with activation
  # checkpointing; accumulate_grad_batches keeps the effective step at
  # 12 studies. num_workers is per-DDP-process: 2 processes x 2 workers
  # saturates Kaggle's 4 vCPUs without decoder thrash.
  model:
    init_params:
      grad_checkpointing: true
      chunk_size: 48

  trainer:
    init_params:
      accumulate_grad_batches: 4

  datamodule:
    init_params:
      batch_size: 3
      num_workers: 2
