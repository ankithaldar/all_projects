[project]
name = 'kaggle-rsna-knee-abnormality-detection'
version = '0.2.0'
description = 'RSNA knee abnormality detection: multimodal weak-supervision pipeline (Kaggle)'
readme = 'README.md'
requires-python = '>=3.10,<3.13'

[project.optional-dependencies]
dev = [
  'pytest>=8',
  'ruff>=0.5',
]
# True-3D diversity encoder used by configs/experiment/student_3d_resnet.yaml
monai = [
  'monai>=1.3',
]

[tool.pytest.ini_options]
# Tests import the `knee` package from src/ without an editable install.
pythonpath = ['src']
testpaths = ['tests']
addopts = '-q --strict-markers'
markers = [
  'gpu: requires a CUDA device (deselect with -m "not gpu")',
]

[tool.ruff]
# .pylintrc (Google Python style) is the lint authority; ruff mirrors its
# FORMAT decisions so both tools agree: max-line-length=80, 2-space indent,
# single quotes.
line-length = 80
target-version = 'py311'
indent-width = 2
src = ['src', 'scripts', 'tests']

[tool.ruff.format]
quote-style = 'single'      # single quotes, keep double when string contains '
indent-style = 'space'

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I', 'N', 'UP', 'B']
# UP009: the UTF-8 coding declaration is a mandated project standard, keep it.
ignore = ['N812', 'N803', 'N806', 'UP009']  # lowercase torch conventions

[tool.ruff.lint.isort]
known-first-party = ['knee']

[tool.ruff.lint.per-file-ignores]
# Test files may use fixtures/asserts ruff would otherwise flag stylistically.
'tests/*' = ['B008', 'B011']
