[project]
name = "mlops-study-with-ai"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Ankit Haldar", email = "ankithaldar@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
]

[project.scripts]
mlops-study-with-ai = "mlops_study_with_ai:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
