<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional Boarding Pass Generator</title>

  <!-- External Libraries via CDN -->
  <!-- PDF417 Barcode Generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bwip-js/4.7.0/bwip-js-min.js"
    integrity="sha512-MDtabmDetsQATsClilUhXqOmgQraxAmYDYWTaxzvAD9S0qaJJKMj/WqnxC7VnEAVULW637yr/KZGPbwdvArCJw=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <!-- PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/3.0.3/jspdf.umd.min.js"
    integrity="sha512-+EeCylkt9WHJk5tGJxYdecHOcXFRME7qnbsfeMsdQL6NUPYm2+uGFmyleEqsmVoap/f3dN/sc3BX9t9kHXkHHg=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <!-- HTML to Canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
    integrity="sha512-BNaRQnYJYiPSqHHDb58B0yaPfCu+Wgds8Gp/gU33kqBtgNS4tSPHuGibyoeqMV/TJlSKda6FXzoEyYGjTe+vXA=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <!-- Basic XSS Sanitization -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.7/purify.min.js"
    integrity="sha512-78KH17QLT5e55GJqP76vutp1D2iAoy06WcYBXB6iBCsmO6wWzx0Qdg8EDpm8mKXv68BcvHOyeeP4wxAL0twJGQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <link rel="stylesheet" href="main.css">
</head>
<body>

  <!-- Warning Banner -->
  <!-- <div class="banner">
    ⚠️ MUST run via local server (Live Server) for fetch() to work correctly.
  </div> -->

  <div class="app-container">
    <!-- Controls Panel -->
    <aside class="controls-panel">
      <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2>✈️ Sky Pass Creator</h2>
        <div class="toggle-switch" onclick="toggleDarkMode()">
          <span>🌓</span> Theme
        </div>
      </header>

      <div id="status-msg" class="alert"></div>

      <form id="bp-form" onsubmit="event.preventDefault(); generatePass();">

        <h3>Airline & Route</h3>
        <div class="form-group">
          <label for="airline-select">Airline</label>
          <select id="airline-select" required>
            <option value="" disabled selected>Loading airlines...</option>
          </select>
        </div>

        <div class="row">
          <div class="form-group">
            <label for="from">From</label>
            <input type="text" id="from" placeholder="BLR" maxlength="3" required uppercase>
          </div>
          <div class="form-group">
            <label for="to">To</label>
            <input type="text" id="to" placeholder="CCU" maxlength="3" required uppercase>
          </div>
        </div>

        <h3>Flight Details</h3>
        <h3>Departure</h3>
        <div class="row">
          <div class="form-group">
            <label for="flight-date-depart">Date</label>
            <input type="date" id="flight-date-depart" required>
          </div>
          <div class="form-group">
            <label for="depart-time">Dept. Time</label>
            <input type="time" id="depart-time" required>
          </div>
        </div>


        <h3>Arrival</h3>
        <div class="row">
          <div class="form-group">
            <label for="flight-date-arrival">Date</label>
            <input type="date" id="flight-date-arrival" required>
          </div>
          <div class="form-group">
            <label for="arrival-time">Arrival Time</label>
            <input type="time" id="arrival-time" required>
          </div>
        </div>


        <div class="row">
          <div class="form-group">
            <label for="flight-num">Flight #</label>
            <input type="text" id="flight-num" placeholder="DL123" required>
          </div>
          <div class="form-group">
            <label for="gate">Gate</label>
            <input type="text" id="gate" placeholder="B12" required>
          </div>
        </div>

        <h3>Passenger Info</h3>
        <div class="row">
          <div class="form-group">
            <label for="title">Title</label>
            <select id="title">
              <option value="MR">MR</option>
              <option value="MRS">MRS</option>
              <option value="MS">MS</option>
            </select>
          </div>
          <div class="form-group" style="flex: 2;">
            <label for="first-name">First Name</label>
            <input type="text" id="first-name" placeholder="ANKIT" required>
          </div>
          <div class="form-group" style="flex: 2;">
            <label for="last-name">Last Name</label>
            <input type="text" id="last-name" placeholder="HALDAR" required>
          </div>
        </div>

        <h3> Boarding & Seat</h3>
        <div class="row">
          <div class="form-group">
            <label for="pnr">PNR</label>
            <input type="text" id="pnr" placeholder="XYZ123" required>
          </div>
          <div class="form-group">
            <label for="seat">Seat</label>
            <input type="text" id="seat" placeholder="12A" required>
          </div>
        </div>
        <div class="row">
          <div class="form-group">
            <label for="seq">Seq</label>
            <input type="text" id="seq" placeholder="0012" required>
          </div>
          <div class="form-group">
            <label for="zone">Zone</label>
            <select id="zone">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
            </select>
          </div>
          <div class="form-group">
            <label for="board-time">Board Time</label>
            <input type="time" id="board-time" required>
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="primary full-width">
            <span>⚡ Generate Pass</span>
          </button>
          <button type="button" id="btn-print" class="secondary" onclick="printPass()" disabled>
            <span>🖨️ Print</span>
          </button>
          <button type="button" id="btn-pdf" class="secondary" onclick="exportPDF()" disabled>
            <span>📄 PDF</span>
          </button>
          <button type="button" class="danger full-width" onclick="confirmReset()">
            <span>🗑️ Reset Form</span>
          </button>
        </div>
      </form>
    </aside>

    <!-- Preview Panel -->
    <main class="preview-panel">
      <div class="toolbar">
        <span>Zoom:</span>
        <input type="range" id="zoom-slider" min="0.8" max="5" step="0.05" value="1" oninput="updateZoom(this.value)">
        <span id="zoom-val">80%</span>
      </div>

      <div id="preview-wrapper">
        <iframe id="preview"></iframe>
      </div>
    </main>
  </div>

  <script src="main.js"></script>
</body>
</html>
