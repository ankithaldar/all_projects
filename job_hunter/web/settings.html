<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Job Hunter — Settings</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="nav"></div>
  <main>
    <h1>Scoring weights</h1>
    <div class="card" id="weights"></div>
    <div style="margin:14px 0">
      <button class="btn save" onclick="saveWeights()">Save weights</button>
      <span id="weightSum" class="meta" style="margin-left:12px"></span>
    </div>

    <h1 style="font-size:16px;margin-top:22px">LLM spend (7 days)</h1>
    <div id="llm"></div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script>
    document.getElementById('nav').append(components.nav('/settings.html'));
    const KEYS = ['skills_must', 'skills_nice', 'semantic', 'seniority',
      'title_fit', 'salary_fit', 'recency', 'company_fit'];
    const inputs = {};
    async function load() {
      const settings = await jh.get('/api/settings');
      const w = settings.scoring_weights || {};
      const box = document.getElementById('weights');
      for (const key of KEYS) {
        const row = jh.el('label', {}, key,
          inputs[key] = jh.el('input', {
            type: 'number', step: '0.01', min: '0', max: '1',
            value: (w[key] ?? 0).toFixed(2), oninput: updateSum,
          }));
        box.append(row);
      }
      updateSum();
      const llm = await jh.get('/api/llm/stats?days=7');
      const out = document.getElementById('llm');
      if (!llm.by_provider?.length) { out.append(jh.el('div', { class: 'card' }, 'No LLM calls yet.')); return; }
      out.append(components.table(
        ['Provider', 'Calls', 'Tokens', 'Cost ($)'],
        llm.by_provider,
        r => [r.provider, r.calls, r.tokens, Number(r.cost).toFixed(4)]));
      const t = llm.totals;
      out.append(jh.el('p', { class: 'meta' },
        `Total: ${t.calls} calls · ${t.tokens} tokens · $${Number(t.cost).toFixed(4)}`));
    }
    function updateSum() {
      const sum = KEYS.reduce((acc, k) => acc + (Number(inputs[k].value) || 0), 0);
      const el = document.getElementById('weightSum');
      el.textContent = `sum = ${sum.toFixed(2)} (auto-normalized to 1.0)`;
      el.style.color = Math.abs(sum - 1) < 0.02 ? 'var(--good)' : 'var(--ok)';
    }
    async function saveWeights() {
      const payload = {};
      for (const k of KEYS) payload[k] = Number(inputs[k].value) || 0;
      try {
        await jh.put('/api/settings?key=scoring_weights', payload);
        jh.toast('Weights saved');
      } catch (e) { jh.toast(e.message, true); }
    }
    load();
  </script>
</body>
</html>
