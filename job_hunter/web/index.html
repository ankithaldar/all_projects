<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Hunter — Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="nav"></div>
  <main>
    <h1>Dashboard</h1>
    <div class="kpis" id="kpis" role="status" aria-live="polite"></div>
    <h2 style="font-size:16px">Top recommendations (today)</h2>
    <div id="recs" role="status" aria-live="polite"></div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script>
    document.getElementById('nav').append(components.nav('/'));
    (async () => {
      const kpis = document.getElementById('kpis');
      const box = document.getElementById('recs');
      kpis.replaceChildren();
      box.replaceChildren();
      try {
        const stats = await jh.get('/api/stats/dashboard');
        kpis.append(
          components.kpi('New today', stats.new_today),
          components.kpi('Saved', stats.saved),
          components.kpi('Active jobs', stats.active_jobs),
          components.kpi('Companies', stats.companies));
        const recs = await jh.get('/api/recommendations?per_page=8');
        if (!recs.length) {
          box.append(jh.el('div', { class: 'card' },
            'No recommendations yet. Add companies, upload your resume on the Profile page, then trigger a run from the Runs page.'));
          return;
        }
        for (const rec of recs) {
          box.append(components.recCard(rec, async (status, r) => {
            try {
              await jh.patch(`/api/recommendations/${r.recommendation_id}?status=${status}`);
              jh.toast(status === 'saved' ? 'Saved' : 'Dismissed');
              location.reload();
            } catch (e) { jh.toast(e.message, true); }
          }));
        }
      } catch (e) {
        box.replaceChildren();
        box.append(jh.el('div', { class: 'card', role: 'status', 'aria-live': 'polite' }, `Error: ${e.message}`));
        jh.toast(e.message, true);
      }
    })();
  </script>
</body>
</html>
