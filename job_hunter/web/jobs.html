<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Hunter — Jobs</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="nav"></div>
  <main>
    <h1>Job explorer</h1>
    <div class="row" style="margin-bottom:14px">
      <input id="q" placeholder='Search (e.g. "data science" + python)' aria-label="Search">
      <input id="city" placeholder="City" style="max-width:140px" aria-label="City">
      <select id="mode" style="max-width:150px" aria-label="Work mode">
        <option value="">Any mode</option>
        <option value="remote">Remote</option><option value="hybrid">Hybrid</option>
        <option value="onsite">Onsite</option><option value="unknown">Unknown</option>
      </select>
      <button type="button" class="btn" onclick="load()">Search</button>
    </div>
    <div id="list" role="status" aria-live="polite"></div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script>
    document.getElementById('nav').append(components.nav('/jobs.html'));
    async function load() {
      const box = document.getElementById('list');
      box.replaceChildren();
      try {
        const qs = jh.qs({
          q: document.getElementById('q').value,
          city: document.getElementById('city').value,
          work_mode: document.getElementById('mode').value,
          per_page: 50,
        });
        const rows = await jh.get(`/api/jobs?${qs}`);
        if (!rows.length) { box.append(jh.el('div', { class: 'card' }, 'No postings match.')); return; }
        for (const job of rows) {
          box.append(jh.el('div', { class: 'card' },
            jh.el('div', { class: 'card-head' },
              jh.el('a', { class: 'title', href: job.url, target: '_blank', rel: 'noopener' }, job.title),
              jh.el('span', { class: 'company' }, job.company_name || job.company_raw_name || ''),
              jh.el('span', { class: 'badge' }, job.source_key)),
            jh.el('div', { class: 'meta' },
              [job.city, job.work_mode,
                job.salary_min_lpa || job.salary_max_lpa
                  ? `${job.salary_min_lpa ?? '?'}–${job.salary_max_lpa ?? '?'} LPA` : null]
                .filter(Boolean).join(' · ')),
            jh.el('div', { class: 'rationale' }, (job.description_text || '').slice(0, 220) + '…')));
        }
      } catch (e) {
        box.replaceChildren();
        box.append(jh.el('div', { class: 'card', role: 'status', 'aria-live': 'polite' }, `Error: ${e.message}`));
      }
    }
    load();
  </script>
</body>
</html>
