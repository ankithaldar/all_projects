<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Hunter — Profile</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="nav"></div>
  <main>
    <h1>Candidate profile</h1>
    <div id="profileError" role="status" aria-live="polite"></div>
    <div class="card">
      <div class="row">
        <div><label for="roles">Target roles (comma-separated)</label><input id="roles"></div>
        <div><label for="cities">Cities</label><input id="cities" placeholder="Bengaluru, Pune"></div>
      </div>
      <div class="row">
        <div><label for="remotePref">Remote preference</label>
          <select id="remotePref">
            <option value="any">Any</option><option value="remote">Remote</option>
            <option value="hybrid">Hybrid</option><option value="onsite">Onsite</option>
          </select></div>
        <div><label for="floor">Salary floor (LPA)</label><input id="floor" type="number" min="0" step="0.5"></div>
        <div><label for="years">Experience (years)</label><input id="years" type="number" min="0" step="0.5"></div>
      </div>
      <div class="row">
        <div><label for="tVerts">Target verticals</label><input id="tVerts" placeholder="fintech, ai_ml_infra"></div>
        <div><label for="relocate">Relocate ok?</label>
          <select id="relocate"><option value="no">No</option><option value="yes">Yes</option></select></div>
      </div>
      <label for="summary">Summary</label>
      <textarea id="summary" rows="3" style="width:100%"></textarea>
      <div style="margin-top:12px"><button type="button" id="saveBtn" class="btn save" onclick="save()" disabled>Save profile</button></div>
    </div>

    <h2 style="font-size:16px;margin-top:22px">Resume (LaTeX PDF)</h2>
    <div class="card">
      <label for="resumeFile">Resume PDF</label>
      <input type="file" id="resumeFile" accept=".pdf">
      <button type="button" class="btn" onclick="uploadResume()" style="margin-left:10px">Upload &amp; parse</button>
      <div id="resumeOut" class="meta" style="margin-top:10px" role="status" aria-live="polite"></div>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script>
    document.getElementById('nav').append(components.nav('/profile.html'));
    const $ = id => document.getElementById(id);
    async function load() {
      const errBox = $('profileError');
      errBox.replaceChildren();
      try {
        const p = await jh.get('/api/profile');
        $('roles').value = (p.target_roles || []).join(', ');
        $('cities').value = (p.cities || []).join(', ');
        $('remotePref').value = p.remote_pref || 'any';
        $('floor').value = p.salary_floor_lpa ?? '';
        $('years').value = p.experience_years ?? '';
        $('tVerts').value = (p.target_verticals || []).join(', ');
        $('relocate').value = p.relocate_ok ? 'yes' : 'no';
        $('summary').value = p.summary || '';
        $('saveBtn').disabled = false;
      } catch (e) {
        errBox.replaceChildren();
        errBox.append(jh.el('div', { class: 'card', role: 'status', 'aria-live': 'polite' }, `Error: ${e.message}`));
        jh.toast(e.message, true);
      }
    }
    async function save() {
      try {
        await jh.put('/api/profile', {
          target_roles: $('roles').value.split(',').map(s => s.trim()).filter(Boolean),
          cities: $('cities').value.split(',').map(s => s.trim()).filter(Boolean),
          remote_pref: $('remotePref').value,
          salary_floor_lpa: $('floor').value.trim() === '' ? null : Number($('floor').value),
          experience_years: $('years').value.trim() === '' ? null : Number($('years').value),
          target_verticals: $('tVerts').value.split(',').map(s => s.trim()).filter(Boolean),
          relocate_ok: $('relocate').value === 'yes',
          summary: $('summary').value,
        });
        jh.toast('Profile saved');
      } catch (e) { jh.toast(e.message, true); }
    }
    async function uploadResume() {
      const file = $('resumeFile').files[0];
      if (!file) { jh.toast('Choose a PDF first', true); return; }
      const formData = new FormData(); formData.append('file', file);
      $('resumeOut').textContent = 'Parsing via LLM…';
      try {
        const res = await fetchWithAuth('/api/profile/resume', {method:'POST', body: formData});
        const out = await res.json();
        if (!res.ok) throw new Error(out.detail || res.status);
        $('resumeOut').textContent = out.parsed_ok
          ? `Parsed ${out.pages} pages · skills: ${(out.skills || []).slice(0, 10).join(', ') || '—'}`
          : `Parse failed: ${out.reason}`;
      } catch (e) { $('resumeOut').textContent = ''; jh.toast(e.message, true); }
    }
    load();
  </script>
</body>
</html>
