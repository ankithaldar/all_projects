# Job Hunter application defaults.
# Per-source RPM is adapter-owned (adapters pass explicit rpm=), not read
# from config. Sources below carry only `enabled`.
# Runtime overrides live in the settings table (edited via the UI).
# Sections: app (bind/log) · salary floor · schedule (cron) · sources (per-source
# toggles) · scout (company discovery) · discovery (run knobs) · scoring_weights
# · embeddings · mcp (stdio server commands).

# --- app: API bind address, port, and log level (env APP_* wins over these).
app:
  host: 127.0.0.1
  port: 8088
  log_level: INFO

# --- salary_hard_floor_lpa: postings topping out below this are excluded (gate).
salary_hard_floor_lpa: 45

# --- schedule: cron strings + interval minutes for the worker scheduler.
schedule:
  discovery_cron: '15 6 * * *'
  quick_poll_minutes: 120
  company_refresh_cron: '30 3 * * 0'
  stale_sweep_cron: '0 4 * * *'
  inbox_scan_minutes: 30

# --- sources: per-source enable flag only.
# NOTE: `manual` is NOT a registry adapter — it is the manual-export inbox
# scan (saved LinkedIn/Naukri exports dropped into data/inbox/), not a
# source you fetch from an API.
sources:
  greenhouse: {enabled: true}
  lever: {enabled: true}
  ashby: {enabled: true}
  workable: {enabled: true}
  workday: {enabled: true}
  smartrecruiters: {enabled: true}
  recruitee: {enabled: true}
  personio: {enabled: true}
  remotive: {enabled: true}
  remoteok: {enabled: true}
  weworkremotely: {enabled: true}
  himalayas: {enabled: true}
  arbeitnow: {enabled: true}
  jobicy: {enabled: true}
  cutshort: {enabled: true}
  manual: {enabled: true}

# --- scout: LinkedIn company scouting via the DuckDuckGo search index.
scout:
  # Company discovery: LinkedIn job pages are located through the
  # DuckDuckGo HTML search index (robots: Allow: /) rather than by crawling
  # LinkedIn itself, whose robots.txt disallows /jobs-guest/.
  search_queries: 12
  results_per_query: 25
  search_min_interval_seconds: 3.0
  domain_tlds: [com, in, io, ai, co, net, tech]
  probe_budget: 6
  min_domain_confidence: 0.6
  verify_ats: true
  ingest: true
  seed_file: companies_scouted.yaml

# --- discovery: per-run caps, staleness window, and vertical filters.
discovery:
  max_llm_calls_per_run: 300
  stale_after_days: 45
  company_refresh_chunk: 50
  include_unknown_vertical: false
  target_verticals: []
  blocked_verticals: []

# --- scoring_weights: recommendation component weights (must sum to 1.0).
scoring_weights:
  skills_must: 0.30
  skills_nice: 0.10
  semantic: 0.25
  seniority: 0.10
  title_fit: 0.05
  salary_fit: 0.10
  recency: 0.05
  company_fit: 0.05

# --- embeddings: model id for semantic matching (fastembed).
embeddings:
  model: 'BAAI/bge-small-en-v1.5'

# --- mcp: stdio commands for the 3 MCP servers ({python} = current interpreter).
mcp:
  sources:
    command: '{python}'
    args: ['-m', 'job_hunter.mcp_servers.sources_server']
  resume:
    command: '{python}'
    args: ['-m', 'job_hunter.mcp_servers.resume_server']
  store:
    command: '{python}'
    args: ['-m', 'job_hunter.mcp_servers.store_server']
