[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'job_hunter'
version = '0.1.0'
description = 'Personal agentic job discovery system for India.'
requires-python = '>=3.14'
dependencies = [
  'fastapi>=0.115',
  'uvicorn>=0.30',
  'pydantic>=2.7',
  'pydantic-settings>=2.3',
  'python-dotenv>=1.0',
  'PyYAML>=6.0',
  'httpx>=0.27',
  'tenacity>=8.3',
  'beautifulsoup4>=4.12',
  'feedparser>=6.0',
  'pypdf>=4.2',
  'rapidfuzz>=3.9',
  'apscheduler>=3.10',
  'langchain-core>=0.3',
  'langgraph>=0.2',
  'aiosqlite>=0.20',
  'mcp>=1.2',
  'tiktoken>=0.7',
]

[project.optional-dependencies]
semantic = ['fastembed>=0.3']
dev = [
  'pytest>=8.2',
  'pytest-asyncio>=0.23',
  'ruff>=0.5',
]

[tool.setuptools.packages.find]
where = ['src/job_hunter']
include = ['job_hunter*', 'llm_gateway*']

[tool.pytest.ini_options]
pythonpath = ['src/job_hunter', '.']
testpaths = ['tests']
asyncio_mode = 'auto'

[tool.ruff]
line-length = 100
indent-width = 2
target-version = 'py314'

[tool.ruff.format]
quote-style = 'single'
indent-style = 'spaces'
