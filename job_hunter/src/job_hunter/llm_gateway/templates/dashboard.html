<!doctype html>
<html lang='en'>
  <head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>LLM Gateway Dashboard</title>
    <!-- External script renders with textContent/createElement only. -->
    <link rel='stylesheet' href='/dashboard.css'>
  </head>
  <body>
    <h1>LLM Gateway Dashboard</h1>

    <section class='section'>
      <div class='cards' id='summary-cards'></div>
    </section>

    <section class='section'>
      <h2>Status Breakdown</h2>
      <div class='table-wrap'><table id='statuses'></table></div>
    </section>

    <section class='section'>
      <h2>Per Provider</h2>
      <div class='table-wrap'><table id='providers'></table></div>
    </section>

    <section class='section'>
      <h2>Per Session</h2>
      <div class='table-wrap'><table id='sessions'></table></div>
    </section>

    <section class='section'>
      <h2>Recent Calls</h2>
      <div class='table-wrap'><table id='recent'></table></div>
    </section>

    <script src='/dashboard.js'></script>
  </body>
</html>
