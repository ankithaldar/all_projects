algorithm: MaskablePPO
policy: MultiInputPolicy

hyperparameters:
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

environment:
  max_batch_size: 20
  max_ticks: 8064
  initial_coins: 5998996
  frame_skip: 1
  initial_stash:
    string: 90
    wood: 79
    ribbon: 58
    metal: 41
    needles: 27
    sparkles: 2
    bronze: 30
    silver: 2
    gold: 0
    amethyst: 163
    pendant: 6
    necklace: 0
    orb: 44
    water: 0
    fire: 1
    waterstone: 1
    firestone: 3
    elementstone: 1
    artifact: 0

reward_weights:
  slot_utilization: 0.3
  waste_minimization: 0.1
  target_completion: 1.0
  excess_inventory: 0.05
  coin_efficiency: 0.4
  time_efficiency: 0.5
  batch_optimization: 0.2

training:
  total_timesteps: 2000000
  eval_freq: 10000
  n_eval_episodes: 5
  checkpoint_freq: 50000
  log_dir: output/logs
  model_dir: output/models
