[project]
name = "cat-game-crafting-rl"
version = "0.1.0"
description = "RL agent and GA baseline for optimizing batch production schedules in a crafting game"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.4",
  "gymnasium==0.29.1",
  "stable-baselines3==2.3.2",
  "sb3-contrib==2.3.0",
  "torch==2.2.2",
  "pyyaml==6.0.1",
  "deap==1.4.1",
  "streamlit==1.32.0",
  "plotly==5.20.0",
  "pandas==2.2.1",
  "tensorboard==2.16.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.1.1",
  "pytest-cov==5.0.0",
  "pylint",
  "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
